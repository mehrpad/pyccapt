name: docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# On PRs we only build (catches broken refs without publishing).
# On push to main / on a release tag we also deploy to gh-pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build sphinx html
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.mark.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: setup.py
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[calibration]"
          python -m pip install -r docs/requirements.txt
      - name: Build HTML
        # --keep-going still reports every warning; -W is intentionally
        # disabled because docs include bundled vendor code (Surface Concept
        # scTDC) whose docstring formatting is not maintained here.
        run: |
          sphinx-build -b html --keep-going docs docs/_build/html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
      - id: mark
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy to gh-pages
    if: github.event_name != 'pull_request' && needs.build.outputs.built == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

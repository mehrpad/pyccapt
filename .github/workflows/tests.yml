name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[calibration,dev]"

      - name: Run calibration tests
        run: pytest -q --run-calibration tests/calibration

  control-unit:
    name: control unit tests (Windows / hardware-free)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[control,dev]"
      - name: Run control suite against mocks/simulator
        run: pytest -q --run-control tests/control

  coverage-contracts:
    name: critical-contract coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[calibration,dev]"
      - name: Enforce branch coverage floor on critical contracts
        run: |
          python -m coverage erase
          python -m coverage run --rcfile=.github/coverage-contracts.ini -m pytest -q \
            tests/control/test_chunk_store.py \
            tests/control/test_fault_injection.py \
            tests/control/test_health_dashboard.py \
            tests/control/test_safety_interlock.py \
            tests/calibration/test_dataset_and_model_contracts.py \
            tests/calibration/test_property_and_golden_data.py
          python -m coverage report --rcfile=.github/coverage-contracts.ini

  performance:
    name: multi-million-ion regression thresholds
    runs-on: ubuntu-latest
    env:
      PYCCAPT_RUN_BENCHMARKS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[calibration,dev]"
      - run: pytest -q tests/performance

  clean-artifacts:
    name: clean wheel and sdist installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel into an isolated environment
        run: |
          python -m venv /tmp/pyccapt-wheel
          /tmp/pyccapt-wheel/bin/python -m pip install dist/*.whl
          /tmp/pyccapt-wheel/bin/pyccapt validate-config pyccapt/config.toml
      - name: Install sdist into an isolated environment
        run: |
          python -m venv /tmp/pyccapt-sdist
          /tmp/pyccapt-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/pyccapt-sdist/bin/python -c "import pyccapt; print(pyccapt.__version__)"

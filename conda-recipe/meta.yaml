{% set version_match = load_file_regex(load_file="../pyccapt/__init__.py", regex_pattern='__version__\\s*=\\s*"([^"\\s]+)"') %}
{% set version = version_match.group(1) %}

package:
  name: pyccapt
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv"

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.10
    - adjusttext
    - ase
    - faker
    - fast-histogram
    - h5py
    - imageio
    - ipympl
    - ipywidgets
    - jupyterlab
    - matplotlib-base
    - nglview
    - numpy
    - pandas
    - plotly
    - anywidget
    - kaleido
    - pybaselines
    - pymatgen
    - pyvista
    - scikit-learn
    - scipy
    - tqdm
    - uproot
    - vispy
    - pytables

test:
  imports:
    - pyccapt
    - pyccapt.calibration

about:
  home: https://github.com/mmonajem/pyccapt
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Python package for atom probe control and calibration workflows.
  description: |
    PyCCAPT provides calibration and reconstruction workflows for APT data and
    optional control tooling for APT instrumentation.

extra:
  recipe-maintainers:
    - mmonajem

# ---------------------------------------------------------------------------
# Live (real-time) calibration of the visualization spectrum.
#
# Architecture: a background QThread snapshots the most recent ~100 000
# events every ``live_calibration_refit_interval_s`` seconds, fits a
# voltage + bowl + initial-mass-scale correction in the worker thread,
# and the GUI applies the cached parameters on every render tick using
# vectorized NumPy. The GUI thread is never blocked. See
# ``pyccapt/control/core/live_calibration.py`` for the full algorithm.
#
# Set the interval to 0 to disable the live calibration entirely; the
# spectrum will then always show uncalibrated mc/tof.
live_calibration_refit_interval_s = 15.0
# Preferred cadence: re-fit every N NEW events instead of on a timer. The
# GUI passes its running ion counter to the worker, which re-fits each time
# this many fresh events have arrived (keeps the calibration tracking drift
# without the spectrum constantly resetting). Set <=0 to ignore.
live_calibration_refit_event_interval = 1000
# Minimum events required before the worker bothers to fit. Below this
# count the GUI shows uncalibrated data with a "calibrating…" status.
live_calibration_min_events = 5000
# Voltage-fit R² floor. Fits below this quality are rejected and the
# previous good parameters are kept (or none, if there are no previous
# good parameters). After several consecutive weak fits, the worker
# *invalidates* the cached parameters (see
# live_calibration_max_consecutive_failures) so the spectrum falls
# back to the raw view rather than displaying a stale bad fit.
live_calibration_min_fit_quality = 0.7
# After this many consecutive weak fits, drop the cached parameters
# and let the spectrum fall back to raw. At the default 15 s refit
# cadence this is ~75 s of bad fits before we give up.
live_calibration_max_consecutive_failures = 5
# Mass window (Da) inside which the dominant peak is searched for. Pick
# a window where you expect a strong, well-known peak for your sample.
live_calibration_mass_window_min = 1.0
live_calibration_mass_window_max = 60.0
# Optional: target mass (Da) the dominant peak should land at after the
# initial scaling. Leave commented to use the observed peak as its own
# target (i.e. only correct shape, not absolute scale).
# live_calibration_target_mass = 56.0    # e.g. Fe+ at 56 Da
# Voltage-fit window size: number of consecutive ions per bin used to
# compute the mean (V, t/peak) sample for the polynomial fit. Mirrors
# ``sample_size`` in the offline pipeline (mode='ion_seq'). Larger = fewer
# windows = faster/cheaper fits (the quadratic needs only ~5-10 windows);
# increase this and the bowl tile size below to lower the live-cal CPU cost.
live_calibration_volt_sample_size = 1000
# Polar-tile size (mm) for the bowl correction. The detector is split
# into rings of this width and each ring into angular sectors; one
# (x_med, y_med, t_mean/peak) sample is taken per non-empty cell and a
# 5-parameter radial polynomial (the offline polar default) is fit to the
# samples. Larger tiles = fewer cells = faster. Matches the offline
# workflow default (5 mm).
live_calibration_bowl_sample_size_mm = 5.0
# EMA smoothing window: average the last N successful parameter sets
# before the GUI applies them. Damps jitter in the displayed spectrum
# from event-pool noise across successive refits. Set to 1 to disable.
live_calibration_ema_window = 3

# Vacuum-pressure alert thresholds (mbar). Each gauge in the Pumps & Vacuum
# window turns red and the main GUI shows a warning when its reading is
# above the matching value here. Lower the number to make the warning more
# sensitive. Set to a very large number (e.g. 1.0) to effectively disable
# a warning for a given gauge.
vacuum_threshold_main = 1e-9
vacuum_threshold_buffer = 1e-9
vacuum_threshold_buffer_back = 1e-2
vacuum_threshold_load_lock = 1e-5
vacuum_threshold_load_lock_back = 1e-1
vacuum_threshold_cryo_load_lock = 1e-5
vacuum_threshold_cryo_load_lock_back = 1e-1

# Pulse frequency ranges (Hz)

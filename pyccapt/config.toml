# Camera-alignment NeoPixel illumination (Arduino Nano, 48 LEDs on D6).
# The connected Nano is the CH340 USB-serial device on COM12.
# Set this to "auto" only if this COM assignment changes; auto searches
# Arduino/CH340/CP210 serial devices for the PyCCAPT sketch.
COM_PORT_camera_illumination = "COM12"
# A dim, diffuse green field is the initial alignment baseline. Green uses
# the most densely sampled Bayer channel on colour cameras, allowing lower
# LED output than blue/white; final colour and geometry must still be tuned
# on the instrument to avoid a specular reflection from the electrode.
camera_illumination_color = "green" # RGB (0, 255, 0); supported: green, red, blue, white
camera_illumination_percent = 25
# Light-on manual/preset exposure (microseconds), ordered side / top / angle.
# The light-off preset remains unchanged in camera.py: 2 s / 1 s / 2 s.
camera_exposure_light_side_us = 20000
camera_exposure_light_top_us = 10000
camera_exposure_light_angle_us = 20000
# Requested maximum stream rate. Actual rate can be lower due to exposure,
# ROI, camera model, or USB bandwidth.
camera_alignment_frame_rate_hz = 30.0

# ===================== CLL fast-vent valves ("Vent CLL" button) =====================
# The "Vent CLL" button (Pumps & Vacuum panel) does a fast sample/cryo exchange
# in the cryo load lock (CLL) by sequencing three valves:
#
#   State                     backing valve             Turbo valve         vent valve
#   -----------------------   -----------------------   -----------------   ----------------
#   "Vent CLL" pressed        OFF                       OFF                 ON  (after 2 s)
#   "Vent CLL" deselected     ON, then OFF after 29 s   ON  (after 30 s)    OFF
#
# --- CLL backing & Turbo valves ---
# On the SAME NI as the gates (COM_PORT_gates -> Dev2, an 8-channel USB-6525
# solid-state-relay module). Each valve is ONE SSR channel, level-controlled
# and energise-to-open: line HIGH = SSR closed = valve powered/OPEN,
# line LOW = valve closed. The USB-6525 latches its output state after the
# task closes (until reprogrammed or powered off), so a single write holds the
# valve and no line is left reserved.
# Physical screw-terminal wiring on the USB-6525 (each SSR channel P0.x has two
# terminals P0.xA / P0.xB that the valve is wired across):
#   backing valve -> pins 13/14 = P0.6A / P0.6B -> Dev2/port0/line6
#   Turbo valve   -> pins 15/16 = P0.7A / P0.7B -> Dev2/port0/line7
# WARNING: the gates use line0..line5 on this SAME device. Only line6 and line7
# are free - never point these at line0..5 or you will drive a gate.
cll_backing_valve_line = 6
cll_turbo_valve_line = 7
#
# --- CLL vent valve ---
# On a SEPARATE NI USB-6501. The relay SIG line was identified empirically
# (devices_test/cll_vent_valve_blink.py + voltmeter) as DAQmx channel
# Dev3/port1/line7 (= P1.7). Wire the relay: SIG -> that terminal, VCC -> +5V,
# GND -> GND. This valve is level-controlled: line HIGH = valve ON (venting),
# line LOW = valve OFF. Confirm the device name ("Dev3") in NI MAX.
# NOTE: the 6501 outputs are open-collector with a pull-up, so an UNDRIVEN line
# floats HIGH (relay ON). The GUI holds a task on this line and drives it LOW at
# startup and on deselect to keep the vent closed.
COM_PORT_cll_vent_valve = "Dev3/port1/line7"
#
# --- Sequencing delays (seconds) ---
cll_vent_on_delay = 2       # on press: wait this long, then open the vent valve
cll_backing_off_delay = 90  # on deselect: backing opens now, then closes after this
cll_turbo_on_delay = 90     # on deselect: wait this long, then open the Turbo valve


cryo_sensor_3 = "stage"
cryo_sensor_3_index = 1

cryo_sensor_4 = "load_lock"
cryo_sensor_4_index = 3
COM_PORT_V_dc = "COM6"
COM_PORT_V_p = "COM4"
COM_PORT_gauge_mc = "COM5"
COM_PORT_gauge_bc = "COM2"
COM_PORT_gauge_ll = "COM1"
COM_PORT_gauge_cll = "COM8"
COM_PORT_signal_generator = "USB0::0xF4EC::0x1101::SDG6XBAD2R0601::INSTR"
COM_PORT_thorlab_motor = "27261754"

# SmarAct MCS2 stage controllers (locator string passed to ctl.Open).
# Use "network:sn:<serial>" for an Ethernet controller, or the value returned
# by ctl.FindDevices() for USB.  These two devices are addressed independently
# and MUST be different physical controllers:
#   * stage_smartact_main   -> sample / specimen stage (Stage Control window)
#   * stage_smartact_laser  -> laser focusing stage (Laser Control window)
# Set either one to "" (empty string) to disable that GUI's stage section
# without showing any error - useful when only one MCS2 is plugged in.
stage_smartact_main = "network:sn:MCS2-00017944"
stage_smartact_laser = "network:sn:MCS2-00017951"

# Default "home" position for the Home button on the stage / laser GUIs.
# Values are in millimetres.  The Home button moves all three axes to these
# coordinates after referencing has run (or immediately if the controller
# already knows its reference).
stage_home_x_mm = 1.726
stage_home_y_mm = 2.235
stage_home_z_mm = -8.600
laser_stage_home_x_mm = 0.0
laser_stage_home_y_mm = 0.0
laser_stage_home_z_mm = 0.0

# SmarAct REFERENCING_OPTIONS bitmask used by find_reference().
#   0x01 = START_DIR    (0 = forward, 1 = backward as starting direction)
#   0x02 = REVERSE_DIR  (auto-reverse if end stop is hit before the
#                        reference mark is found)
#   0x04 = AUTO_ZERO    (zero the absolute position once the mark is found)
# Default 0x07 = START_DIR | REVERSE_DIR | AUTO_ZERO:
#   * starts the search BACKWARD so the stage moves away from anything
#     mounted in front (sample, load lock, optics) instead of into it,
#   * auto-reverses if the back end stop is hit before the mark is found,
#   * zeros the absolute position once the mark is found.
# Drop bit 0x01 (-> 0x06) if your geometry has the obstruction behind
# the stage instead.  Set to 0 to reproduce the old broken behaviour.
stage_referencing_options = 0x07
# Per-axis Reference timeout in seconds.  120 s is plenty for SLC stages
# at typical reference-search velocity; bump for very long travels.
stage_reference_timeout_s = 120
# Velocity (mm/s) used during Reference.  Decoupled from the per-axis
# sliders because Reference should be predictable regardless of what
# slider the user moved last - using the slider's value made the laser
# stage's reference feel painfully slow when the slider was at level 1.
# 5 mm/s is a safe brisk pace for SLC positioners.
stage_reference_velocity_mm_s = 5.0

# ---------------------------------------------------------------------------
# Surface Concept TDC calibration constants.  Were hard-coded in
# tdc_surface_concept.py; moved here so different rigs can be tuned
# without touching source.
# ---------------------------------------------------------------------------
# Time-of-flight conversion: ns per TDC bin.  27.432 ps / (1000 * 4)
# = 6.858e-3 ns / bin = the value previously hard-coded as TOFFACTOR.
sc_tof_ns_per_bin = 0.006858
# Detector binning resolution (bins across the full detector face).
sc_detector_bins = 4900
# Internal binning factor applied by the controller.
sc_detector_binning_factor = 2
# Detector physical width (mm) used to convert bins to mm.
sc_detector_width_mm = 80
# Detector usable half-width (cm).  Hits with |x_det| or |y_det| beyond
# this radius are flagged as "outside detector" and excluded from the
# raw-data analysis peak yields.  80 mm full width → ±40 mm = ±4 cm.
sc_detector_limit_cm = 4.0
# Exposure time (TDC tick units, integer).  Controls how long the TDC
# integrates between callbacks.  Lower = faster GUI updates, higher
# CPU.  Surface Concept default 100 worked well in practice.
sc_exposure_time = 100

# ---------------------------------------------------------------------------
# RoentDek hexanode (3-delay-line) calibration constants for the raw-data
# analysis workflow.  Kept here so the same code can serve different rigs.
# ---------------------------------------------------------------------------
# Time-of-flight conversion: ns per TDC bin for the 6-DLTS sum reconstruction.
ro_tof_ns_per_bin = 0.025
# Number of TDC bins across the full detector face.
ro_detector_bins = 4900
# Internal binning factor applied by the controller.
ro_detector_binning_factor = 2
# Detector physical width (mm).  RoentDek hexanodes are typically 80 mm.
ro_detector_width_mm = 80
# Detector usable half-width (cm).  Same convention as the SC entry.
ro_detector_limit_cm = 4.0

# Speed slider range for both GUIs.  Mirrors the "Simple Mode" levels shown on
# the SmarAct MCS2 hand-control display (1 = slowest, 11 = fastest).  Each
# level is mapped to an actual MOVE_VELOCITY by stage_smartact_speed_mm_s
# below (level^2 * factor in mm/s, capped at the max).
stage_speed_level_min = 1
stage_speed_level_max = 11
stage_speed_level_default = 5
# Velocity (mm/s) corresponding to slider level 11.  Only used when
# stage_speed_table_mm_s below is empty.  Lower levels are then scaled
# quadratically so the slider feels exponential-ish.
stage_speed_max_mm_s = 1.0
# Per-level velocity table (mm/s), one entry per slider level.  When set,
# this takes precedence over stage_speed_max_mm_s and lets you make the
# GUI levels match the MCS2 hand-control display exactly: step the
# controller through Simple Mode levels 1..11, read off the velocity each
# one shows, and put the values here in order.  Default below is a clean
# power-of-2 table from 1 µm/s to ~1 mm/s, safe for atom-probe positioning.
stage_speed_table_mm_s = [0.001, 0.002, 0.004, 0.008, 0.016, 0.032, 0.064, 0.128, 0.256, 0.512, 1.024]
# Effective "joystick deflection time" (seconds): the per-click jog distance
# is computed as velocity * this value, so faster slider settings produce
# proportionally larger jogs - just like the MCS2 hand-control where only
# speed is set and the distance follows from how long the knob is deflected.
stage_click_duration_s = 0.2
# Velocity (mm/s) used by the Home button.  Decoupled from the per-axis
# sliders because Home should be fast and predictable regardless of what
# slider the user happens to have moved last.  Default 1 mm/s = the
# table top-end; lower if your stage is fragile.
stage_home_velocity_mm_s = 1.0

# ---------------------------------------------------------------------------
# Closed-loop control gains for the main GUI's "Control Algorithm" dropdown
# (Proportional / Proportional aggressive / Adaptive P / PID).
# ---------------------------------------------------------------------------

# Proportional aggressive: the upward voltage step is multiplied by this
# factor (downward step uses the normal vdc_step_down so the loop still
# brakes gently when rate is too high).  > 1 = ramps up faster.
control_p_aggressive_up_factor = 3.0

# Adaptive P: starts at the normal proportional step but scales itself
# based on observed response.  If the error keeps the same sign for many
# iterations (loop is too sluggish) the multiplier grows toward _max_.
# If the error keeps flipping sign (loop is overshooting) it shrinks
# toward _min_.  Both bounds are dimensionless multipliers on the
# proportional step.
control_adaptive_min_factor = 0.3
control_adaptive_max_factor = 3.0
control_adaptive_grow_threshold = 5   # consecutive same-sign errors -> grow
control_adaptive_shrink_threshold = 3 # sign flips within window -> shrink

# PID gains (Kp, Ki, Kd) - only used when "PID" is selected.  These are
# starting points; expect to retune empirically on real hardware.
control_pid_kp = 1.0
control_pid_ki = 0.1
control_pid_kd = 0.05
# Hard cap on the per-iteration PID voltage step (V), applied symmetrically
# (-cap .. +cap).  Mirrors the 40 V cap on the Proportional branch.
control_pid_max_step_v = 40.0

# Email notification configuration for the pyccapt experiment-finished
# message.
#
# To enable email notifications:
#
#   1. Copy this file to ``email_credentials.toml`` in the same folder
#      (``pyccapt/files/email_credentials.toml``).
#   2. Fill in real values for ``sender_email`` and ``password``.
#   3. Enter the recipient address in the main GUI (the "Email" field of
#      the Run page).
#
# The real ``email_credentials.toml`` is gitignored — it will never be
# committed to the repository. Only this ``.example`` file is checked in.
#
# If ``email_credentials.toml`` is missing, the experiment-finished email
# step is silently skipped (the experiment itself still runs to
# completion); a clear note is written to the apt.log of that experiment.

# SMTP server hostname (Gmail shown as the historical default).
smtp_server = "smtp.gmail.com"

# Common ports: 465 (SSL/TLS, recommended), 587 (STARTTLS), 25 (plain).
smtp_port = 465

# Whether the sender address is a real account that requires login.
# For most servers (Gmail, Outlook, university SMTP) leave this true.
use_login = true

# The "From:" address. For Gmail, this must be a Gmail account.
sender_email = "your-account@gmail.com"

# IMPORTANT for Gmail: this is *not* your normal Gmail password. Generate
# a 16-character App Password at https://myaccount.google.com/apppasswords
# and paste it here (with or without spaces).
password = "xxxxxxxxxxxxxxxx"

# Optional. Friendly name shown in the From: header. If omitted, only the
# bare address is used.
sender_display_name = "PyCCAPT Experiment Bot"

# Optional. Additional addresses copied on every notification. The main
# recipient is still the "Email" field from the GUI; these are extras.
# cc = ["lab-archive@example.com"]

# Optional. If true, attach the experiment's ``apt.log`` and
# ``parameters.txt`` to the email so the recipient has the full context
# without needing access to the lab PC.
attach_experiment_files = true

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "calibration: calibration-module tests",
    "control: control-module tests",
]

###############################################################################
# Ruff: linter + formatter (replaces flake8/black/isort).
#
# The starting ruleset is intentionally narrow so the existing codebase passes
# without churn. Tighten incrementally by adding more rule families to `select`.
###############################################################################
[tool.ruff]
line-length = 127
target-version = "py310"
extend-exclude = [
    ".claude",
    "docs/_build",
    "docs/_static",
    "**/_build/**",
    ".tmp_paper",
    "analysis_outputs",
    "**/.ipynb_checkpoints",
    "**/*.ipynb",
]

[tool.ruff.lint]
# Conservative starting set, matches what the previous flake8 step caught:
# E9 = syntax errors, F63/F7/F82 = obvious bugs (undefined name, mis-imports).
# Add more rule families as the codebase tightens up.
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false
